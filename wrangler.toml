name = "voice-agent"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "src/liff"
binding = "ASSETS"

# 部署前用 `wrangler d1 create voice-agent-db` 建立，把回傳的 database_id 貼進來。
[[d1_databases]]
binding = "DB"
database_name = "voice_agent_db"
database_id = "4f90a993-2db2-41d2-97b2-a7db6acac4ca"

# 知識庫問答用的向量索引；正式建立前先確認 bge-m3 的向量維度。
[[vectorize]]
binding = "KNOWLEDGE_INDEX"
index_name = "voice-agent-knowledge-index"

[ai]
binding = "AI"

[vars]
# LIFF_ID: 請用 `wrangler secret put LIFF_ID` 設定（你的 LINE LIFF App ID）
# XAI_API_KEY: 請用 `wrangler secret put XAI_API_KEY` 設定（xAI API 金鑰）
# OPENAI_API_KEY: 請用 `wrangler secret put OPENAI_API_KEY` 設定（LINE 文字回應）
# OPENAI_TEXT_MODEL: 未設定時使用 gpt-4.1；需要切換模型時再明確設定。
# LINE_CHANNEL_ACCESS_TOKEN、LINE_CHANNEL_SECRET、KNOWLEDGE_INGEST_TOKEN 請用 secret put 設定。
